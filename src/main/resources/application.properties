spring.application.name=emprestimo

spring.datasource.url=jdbc:h2:file:./dados/emprestimo

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

jwt.segredo=${JWT_SEGREDO}

server.port=${PORT:8081}
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}

app.admin.usuario=${ADMIN_USUARIO}
app.admin.senha=${ADMIN_SENHA}

app.colaborador.usuario=${COLAB_USUARIO}
app.colaborador.senha=${COLAB_SENHA}